# Alembic configuration for Biz-Agent 2.0.
# The database URL is NOT stored here: env.py reads DATABASE_URL (falls back to
# backend/app/db/session.py's default sqlite:///<backend>/bizagent.db).

[alembic]
script_location = alembic
prepend_sys_path = .
# Template for generated migration filenames.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
